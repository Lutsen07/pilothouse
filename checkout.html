<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Checkout — Pilothouse</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Source+Sans+3:wght@400;600;650&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/site.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='14' fill='%23b44a1c'/><circle cx='16' cy='16' r='5' fill='%23f3efe6'/></svg>" />
  <script src="js/offer.js"></script>
  <script src="js/checkout.js"></script>
  <script src="js/fulfill.js"></script>
</head>
<body>
  <nav class="nav">
    <a class="brand" href="index.html">Pilothouse</a>
    <span class="nav-note" id="mode-label">Checkout</span>
  </nav>

  <div class="wrap">
    <div class="pay-box">
      <p class="kicker">The Weekly Shop Kit</p>
      <h1 id="title">The Weekly Shop Kit</h1>
      <p class="amt" id="amt">$89</p>
      <p>One time. Instant download. Word, Excel, and a calendar file.</p>
      <p style="margin: 1.2rem 0 0;">
        <button type="button" class="cta" id="pay">Pay and get the kit</button>
      </p>
      <p class="fine">On the live site this button goes to Stripe. This page is only the local stand-in.</p>
    </div>
  </div>

  <footer class="site-footer"><a href="index.html">Back to the kit</a></footer>

  <script>
    (function () {
      var offer = window.CadenceOffer.getOffer();
      var q = window.CadenceCheckout.parseCheckoutQuery(location.search);
      document.getElementById('title').textContent = offer.productName;
      document.getElementById('amt').textContent = window.CadenceOffer.formatPrice(offer);
      if (q.mode === 'test') {
        document.getElementById('mode-label').textContent = 'Test checkout';
      }
      document.getElementById('pay').addEventListener('click', function () {
        var grant = window.CadenceFulfill.accessPayload({ offer: offer, channel: 'test-checkout' });
        try { sessionStorage.setItem('cadence_grant', JSON.stringify(grant)); } catch (e) {}
        var next = q.success || offer.successPath || 'thanks.html';
        location.href = next + (next.indexOf('?') >= 0 ? '&' : '?') + 'paid=1&sku=' + encodeURIComponent(offer.sku);
      });
    })();
  </script>
</body>
</html>
